name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832e0b1 # v4.0.3
        with:
          node-version: 22
          cache: 'npm'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools fakeroot

      - name: Install dependencies
        run: npm ci

      - name: Build application bundles
        run: npm run build

      - name: Package release binaries
        run: npm run package:dist
        env:
          # Windows Code Signing
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS Notarization & Signing
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify Electron Fuses on packaged binary
        run: npm run fuses:verify

      - name: Generate SHA-256 Checksums (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          shasum -a 256 ./*.exe ./*.dmg ./*.zip ./*.AppImage ./*.yml > "SHA256SUMS-${{ matrix.os }}.txt" 2>/dev/null || true

      - name: Generate SHA-256 Checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location dist
          $files = Get-ChildItem -File -Include *.exe, *.zip, *.yml -Recurse
          $hashes = foreach ($f in $files) {
            $h = Get-FileHash -Path $f.FullName -Algorithm SHA256
            "{0}  {1}" -f $h.Hash.ToLower(), $f.Name
          }
          $hashes | Out-File -Encoding ascii SHA256SUMS-windows-latest.txt

      - name: Publish artifacts to GitHub Release
        uses: softprops/action-gh-release@c062e49339e144a1795ad18a1a36412f5a0be5cf # v2.2.1
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.yml
            dist/SHA256SUMS-*.txt
          draft: false
          prerelease: contains(github.ref, '-beta')
          generate_release_notes: true
